{% if image is chart %}
    <figure class="chart chart--{{ image.kind }}{% if image.data.get('mini') %} chart--mini{% endif %}" data-chart>
        <div class="chart-plot" role="img" aria-label="{{ alt | label_text }}" data-tl-aria-label="{{ alt | e }}"></div>
        <script type="application/json">{{ image.to_json() }}</script>
        <figcaption class="chart-readout" aria-live="polite"></figcaption>
        {% if caption %}
            <p class="caption">{{ caption | label }}</p>
        {% endif %}
    </figure>
{% else %}
    <figure class="figure">
        {% if image_format.value == 'svg' and not image.endswith('.svg') %}
            {{- image.replace('<svg ', '<svg class="figure-image" role="img" aria-label="' ~ (alt | e) ~ '" ', 1) }}
        {% else %}
            <img class="figure-image" src="{{ image }}" alt="{{ alt }}" loading="lazy">
        {% endif %}
        {% if caption %}
            <figcaption class="caption">{{ caption | label }}</figcaption>
        {% endif %}
    </figure>
{% endif %}
