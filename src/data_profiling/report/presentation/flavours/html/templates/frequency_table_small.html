<div class="minifreq{% if idx is defined %} minifreq--{{ idx }}{% endif %}" id="minifreqtable{{ varid }}">
    {% if rows | length > 0 %}
        <table>
            {% for row in rows %}
                <tr class="{{ row['extra_class'] }}">
                    {% set shown = (row['label'] | label) if row['extra_class'] else (row['label'] | fmt) %}
                    <th scope="row"{% if not redact and not row['extra_class'] %} title="{{ row['label'] | fmt }}"{% endif %}>{% if not redact %}{{ shown }}{% else %}<span class="redacted" {{ ta('aria-label', 'freq.redacted') }}></span>{% endif %}</th>
                    <td>
                        <span class="freq-bar"><span style="width: {{ row['width'] | fmt_percent(edge_cases=False) }}"></span></span>
                    </td>
                    <td class="num">{{ row['count'] }}</td>
                </tr>
            {% endfor %}
        </table>
    {% endif %}
</div>
