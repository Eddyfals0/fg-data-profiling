{% if tabs | length > 0 %}
    <div class="tabs tabs--select{% if nested %} tabs--nested{% endif %}{% if classes %} {{ classes }}{% endif %}" data-tabs{% if id %} id="{{ id }}"{% endif %}>
        <label class="field field--select">
            <span class="field-label">{{ tt('tabs.show') }}</span>
            <select data-tab-select>
                {% for tab in tabs %}
                    <option value="tab-pane-{{ anchor_id }}-{{ tab.anchor_id }}">{{ tab.name | striptags | label_text }}</option>
                {% endfor %}
            </select>
        </label>
        {% for tab in tabs %}
            <div class="tabpanel"
                 role="region"
                 aria-label="{{ tab.name | striptags | label_text }}"
                 id="tab-pane-{{ anchor_id }}-{{ tab.anchor_id }}"
                 {% if not loop.first %}hidden{% endif %}>
                {{ tab.render() }}
            </div>
        {% endfor %}
    </div>
{% endif %}
