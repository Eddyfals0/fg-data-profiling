<div class="grid grid--{{ batch_size }}">
    {% for item in items %}
        <div class="grid-cell{% if item.content['classes'] %} {{ item.content['classes'] }}{% endif %}">
            {% if "name" in item.content %}
                {% if subtitles or item.content["subtitles"] %}
                    <h5 class="item-title item-title--small">{{ item.name | label }}</h5>
                {% elif titles or item.content["titles"] %}
                    <h4 class="item-title">{{ item.name | label }}</h4>
                {% endif %}
            {% endif %}
            {{ item.render() }}
        </div>
    {% endfor %}
</div>
