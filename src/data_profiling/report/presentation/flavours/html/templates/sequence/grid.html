{% if items[0].__str__() == 'HTMLVariableInfo' %}
    <div class="sheet-top sheet-top--{{ items | length - 1 }}">
        <div class="sheet-info">{{ items[0].render() }}</div>
        {% for item in items[1:] %}
            <div class="sheet-cell{% if item.content['classes'] %} {{ item.content['classes'] }}{% endif %}">{{ item.render() }}</div>
        {% endfor %}
    </div>
{% else %}
    <div class="grid grid--{{ items | length }}">
        {% for item in items %}
            <div class="grid-cell{% if item.content['classes'] %} {{ item.content['classes'] }}{% endif %}">{{ item.render() }}</div>
        {% endfor %}
    </div>
{% endif %}
