<div class="sections{% if full_width %} sections--full{% endif %}">
    {% for section in sections %}
        {% set html = section.render() %}
        {% if html | length > 0 %}
            <section id="{{ section.content['anchor_id'] }}" class="section section--{{ section.content['anchor_id'] }}" aria-labelledby="{{ section.content['anchor_id'] }}-title">
                <h2 class="section-title" id="{{ section.content['anchor_id'] }}-title">{{ section.content['name'] | label }}</h2>
                {{ html }}
            </section>
        {% endif %}
    {% endfor %}
</div>
